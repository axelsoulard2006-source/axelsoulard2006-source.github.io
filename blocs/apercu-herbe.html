<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blocaria — aperçu de l'herbe</title>
<style>
  body { margin: 0; background: #1d1830; color: #fff; font: 15px system-ui, sans-serif; }
  header { padding: 14px 20px; background: #2a1f4a; }
  h1 { margin: 0; font-size: 22px; } header p { margin: 4px 0 0; opacity: .8; }
  .row { display: flex; gap: 22px; padding: 18px 20px; flex-wrap: wrap; align-items: flex-start; }
  .card { background: #2a2444; border-radius: 14px; padding: 12px; }
  .card h3 { margin: 0 0 8px; font-size: 14px; color: #ffe14a; }
  canvas { image-rendering: pixelated; display: block; }
  #gl { width: 100%; height: 460px; border-radius: 14px; }
</style>
</head>
<body>
<header><h1>Herbe de Blocaria — nouvelle version (64×64, peinte pixel par pixel)</h1><p>Dessus et côté seuls (agrandis), puis posés côte à côte, puis sur un petit terrain en 3D.</p></header>
<div class="row">
  <div class="card"><h3>Dessus (×4)</h3><canvas id="topBig" width="256" height="256"></canvas></div>
  <div class="card"><h3>Côté (×4)</h3><canvas id="sideBig" width="256" height="256"></canvas></div>
  <div class="card"><h3>Dessus en mosaïque 4×4 (raccords)</h3><canvas id="tileTop" width="256" height="256"></canvas></div>
  <div class="card"><h3>Côté en mosaïque 4×2</h3><canvas id="tileSide" width="256" height="128"></canvas></div>
</div>
<div class="row"><div class="card" style="flex:1;min-width:300px"><h3>En jeu (terrain 3D)</h3><canvas id="gl"></canvas></div></div>
<script src="../lib/three.min.js"></script>
<script>
/* ===== Herbe de Blocaria : peinture procédurale 64×64, raccord sur les bords ===== */
const S = 64;
function rng(seed) { let s = seed >>> 0 || 1; return () => (s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296; }
// bruit de valeur périodique (raccord) : grille cellsxcells interpolée en douceur
function pnoise(cells, seed) {
  const r = rng(seed), g = []; for (let i = 0; i < cells * cells; i++) g.push(r());
  const at = (x, y) => g[((y % cells) + cells) % cells * cells + ((x % cells) + cells) % cells], sm = t => t * t * (3 - 2 * t);
  return (px, py) => { const fx = px / S * cells, fy = py / S * cells, x0 = Math.floor(fx), y0 = Math.floor(fy), tx = sm(fx - x0), ty = sm(fy - y0);
    const a = at(x0, y0), b = at(x0 + 1, y0), c = at(x0, y0 + 1), d = at(x0 + 1, y0 + 1); return (a + (b - a) * tx) + ((c + (d - c) * tx) - (a + (b - a) * tx)) * ty; };
}
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
function ramp(stops, t) { t = Math.max(0, Math.min(1, t)); for (let i = 0; i < stops.length - 1; i++) { const [p0, c0] = stops[i], [p1, c1] = stops[i + 1]; if (t <= p1) return mix(c0, c1, (t - p0) / (p1 - p0)); } return stops[stops.length - 1][1]; }
function buf() { return { d: new Float32Array(S * S * 4) }; }
function put(B, x, y, c, a) { x = ((x % S) + S) % S; y = ((y % S) + S) % S; const k = (y * S + x) * 4, al = a == null ? 1 : a; for (let i = 0; i < 3; i++) B.d[k + i] = B.d[k + i] * (1 - al) + c[i] * al; B.d[k + 3] = 255; }
function get(B, x, y) { x = ((x % S) + S) % S; y = ((y % S) + S) % S; const k = (y * S + x) * 4; return [B.d[k], B.d[k + 1], B.d[k + 2]]; }
function toCanvas(B) { const c = document.createElement('canvas'); c.width = c.height = S; const g = c.getContext('2d'), im = g.createImageData(S, S); for (let i = 0; i < S * S * 4; i++) im.data[i] = Math.max(0, Math.min(255, Math.round(B.d[i]))); g.putImageData(im, 0, 0); return c; }

const GRASS = [[0, hex('#26591c')], [0.25, hex('#357a27')], [0.5, hex('#4f9a35')], [0.75, hex('#6db648')], [1, hex('#93d062')]];

/* ---------- le dessus ---------- */
function grassTop(seed) {
  const B = buf(), r = rng(seed), n1 = pnoise(4, seed + 1), n2 = pnoise(8, seed + 2), n3 = pnoise(16, seed + 3), moss = pnoise(3, seed + 4);
  // fond : nuances douces + taches plus sombres (touffes) et plus claires (soleil)
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    let t = 0.44 + (n1(x, y) - 0.5) * 0.42 + (n2(x, y) - 0.5) * 0.2 + (n3(x, y) - 0.5) * 0.08 + (r() - 0.5) * 0.035;
    const m = moss(x, y); t += (m - 0.5) * 0.12;
    put(B, x, y, ramp(GRASS, t * 0.9));
  }
  // un peu de terre qui apparaît entre les touffes
  for (let i = 0; i < 9; i++) { const cx = r() * S | 0, cy = r() * S | 0, rad = 1 + r() * 1.6; for (let y = -2; y <= 2; y++) for (let x = -2; x <= 2; x++) if (x * x + y * y <= rad * rad && r() < 0.8) put(B, cx + x, cy + y, mix(hex('#5b4026'), hex('#7a5836'), r()), 0.85); }
  // les brins : base sombre, pointe claire, légèrement courbés, orientés au hasard
  for (let i = 0; i < 380; i++) {
    const x0 = r() * S, y0 = r() * S, ang = -Math.PI * 0.75 + (r() - 0.5) * 1.6, len = 3 + r() * 5, bend = (r() - 0.5) * 0.5, shade = 0.3 + r() * 0.45;
    let x = x0, y = y0, a = ang;
    for (let s = 0; s <= len; s += 0.7) {
      const k = s / len, col = ramp(GRASS, shade + k * 0.5);
      put(B, Math.round(x) + 1, Math.round(y) + 1, ramp(GRASS, shade * 0.35), 0.45);   // ombre portée du brin (lumière en haut à gauche)
      put(B, Math.round(x), Math.round(y), col, 0.95);
      x += Math.cos(a) * 0.7; y += Math.sin(a) * 0.7; a += bend * 0.2;
    }
    put(B, Math.round(x), Math.round(y), ramp(GRASS, Math.min(1, shade + 0.6)), 0.95);   // pointe éclairée
  }
  // petites touffes plus denses (étoiles de brins)
  for (let i = 0; i < 26; i++) {
    const cx = r() * S, cy = r() * S, n = 6 + (r() * 6 | 0);
    for (let j = 0; j < n; j++) { const a = j / n * Math.PI * 2 + r() * 0.4, len = 2 + r() * 3.5; for (let s = 0; s <= len; s += 0.6) put(B, Math.round(cx + Math.cos(a) * s), Math.round(cy + Math.sin(a) * s), ramp(GRASS, 0.3 + s / len * 0.65), 0.95); }
    put(B, Math.round(cx), Math.round(cy), ramp(GRASS, 0.15), 1);
  }
  // rosée et petits trèfles
  for (let i = 0; i < 14; i++) put(B, r() * S | 0, r() * S | 0, hex('#dff7c8'), 0.85);
  for (let i = 0; i < 5; i++) { const cx = r() * S | 0, cy = r() * S | 0; for (const [dx, dy] of [[0, 0], [1, 0], [0, 1], [-1, 0], [0, -1]]) put(B, cx + dx, cy + dy, dx || dy ? hex('#4f9a35') : hex('#2f6b22'), 0.9); }
  return B;
}

/* ---------- le côté ---------- */
const DIRT = [[0, hex('#4a3220')], [0.35, hex('#634330')], [0.65, hex('#7a5638')], [1, hex('#946a46')]];
function grassSide(seed) {
  const B = buf(), r = rng(seed), n1 = pnoise(4, seed + 11), n2 = pnoise(8, seed + 12), n3 = pnoise(16, seed + 13), edge = pnoise(8, seed + 14), edge2 = pnoise(16, seed + 15);
  // la terre
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const t = 0.5 + (n1(x, y) - 0.5) * 0.35 + (n2(x, y) - 0.5) * 0.25 + (n3(x, y) - 0.5) * 0.2 + (r() - 0.5) * 0.1;
    put(B, x, y, ramp(DIRT, t));
  }
  // cailloux (avec reflet en haut à gauche et ombre en bas à droite)
  const PEB = [hex('#b9b3a8'), hex('#948e84'), hex('#6f6a62'), hex('#2e2015')];   // clair, moyen, sombre, ombre
  for (let i = 0; i < 12; i++) {
    const cx = r() * S | 0, cy = 20 + (r() * (S - 24) | 0), rw = 1.2 + r() * 1.6, rh = 1 + r() * 1.1;
    for (let y = -3; y <= 4; y++) for (let x = -3; x <= 4; x++) { const q = (x * x) / (rw * rw) + (y * y) / (rh * rh), qs = ((x - 1) * (x - 1)) / (rw * rw) + ((y - 1) * (y - 1)) / (rh * rh); if (q > 1 && qs <= 1) put(B, cx + x, cy + y, PEB[3], 0.55); }
    for (let y = -3; y <= 3; y++) for (let x = -3; x <= 3; x++) { const q = (x * x) / (rw * rw) + (y * y) / (rh * rh); if (q > 1) continue; const lit = -x - y; put(B, cx + x, cy + y, lit >= 1 ? PEB[0] : lit <= -1 ? PEB[2] : PEB[1]); }
  }
  // petites racines claires sous l'herbe
  for (let i = 0; i < 9; i++) { let x = r() * S, y = 14 + r() * 10; for (let s = 0; s < 6 + r() * 8; s++) { put(B, Math.round(x), Math.round(y), hex('#8a6644'), 0.3); x += (r() - 0.5) * 1.6; y += 0.6 + r() * 0.6; } }
  // la bordure d'herbe : épaisseur variable (raccord en x) + mèches qui retombent
  const depth = []; for (let x = 0; x < S; x++) depth.push(Math.round(9 + (edge(x, 0) - 0.5) * 9 + (edge2(x, 0) - 0.5) * 5));
  for (let x = 0; x < S; x++) {
    const D = depth[x];
    // ombre portée sous l'herbe
    for (let k = 1; k <= 3; k++) put(B, x, D + k, hex('#2a1c10'), 0.5 - k * 0.12);
    for (let y = 0; y <= D; y++) { const t = 0.75 - y / (D + 1) * 0.5 + (r() - 0.5) * 0.18 + (n2(x, y) - 0.5) * 0.15; put(B, x, y, ramp(GRASS, t)); }
    put(B, x, 0, ramp(GRASS, 0.92 + r() * 0.08));   // arête éclairée
  }
  // mèches
  for (let i = 0; i < 34; i++) {
    const x = r() * S | 0, D = depth[x], len = 2 + (r() * 6 | 0), w = r() < 0.35 ? 2 : 1;
    for (let s = 0; s < len; s++) for (let ww = 0; ww < w; ww++) put(B, x + ww, D + 1 + s, ramp(GRASS, 0.45 - s / len * 0.3));
    put(B, x, D + 1 + len, hex('#2a1c10'), 0.35);
  }
  return B;
}

/* ---------- affichage ---------- */
const topC = toCanvas(grassTop(1234)), sideC = toCanvas(grassSide(5678));
function draw(id, src, nx, ny, sc) { const c = document.getElementById(id), g = c.getContext('2d'); g.imageSmoothingEnabled = false; for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) g.drawImage(src, i * S * sc, j * S * sc, S * sc, S * sc); }
draw("topBig", topC, 1, 1, 4); draw("sideBig", sideC, 1, 1, 4); draw("tileTop", topC, 4, 4, 1); draw("tileSide", sideC, 4, 2, 1);
// petit terrain 3D
(function () {
  const cv = document.getElementById('gl'), R = new THREE.WebGLRenderer({ canvas: cv, antialias: true }); R.setPixelRatio(Math.min(devicePixelRatio, 2));
  const W = cv.clientWidth, Hh = cv.clientHeight; R.setSize(W, Hh, false); R.outputEncoding = THREE.sRGBEncoding;
  const scene = new THREE.Scene(); scene.background = new THREE.Color('#9fd6ff'); scene.fog = new THREE.Fog(0x9fd6ff, 18, 40);
  const cam = new THREE.PerspectiveCamera(55, W / Hh, 0.1, 100); cam.position.set(9, 7, 11); cam.lookAt(0, 0, 0);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x6a5a40, 0.75)); const sun = new THREE.DirectionalLight(0xfff2d8, 0.9); sun.position.set(5, 10, 4); scene.add(sun);
  const tex = c => { const t = new THREE.CanvasTexture(c); t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestMipmapLinearFilter; t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t; };
  const dirtC = (() => { const B = grassSide(91); for (let y = 0; y < 22; y++) for (let x = 0; x < S; x++) { const k = (y * S + x) * 4; } return toCanvas(B); })();
  const mTop = new THREE.MeshLambertMaterial({ map: tex(topC) }), mSide = new THREE.MeshLambertMaterial({ map: tex(sideC) });
  const geo = new THREE.BoxGeometry(1, 1, 1), mats = [mSide, mSide, mTop, mSide, mSide, mSide];
  const r = rng(3);
  for (let x = -7; x <= 7; x++) for (let z = -7; z <= 7; z++) { const h = Math.max(1, Math.round(1.5 + Math.sin(x * 0.5) * 1.2 + Math.cos(z * 0.45) * 1.1)); const m = new THREE.Mesh(geo, mats); m.position.set(x, h - 1, z); m.scale.y = 1; scene.add(m); for (let y = 0; y < h - 1; y++) { const d = new THREE.Mesh(geo, mSide); d.position.set(x, y, z); } }
  let t = 0; (function loop() { requestAnimationFrame(loop); t += 0.003; cam.position.set(Math.cos(t) * 12, 7, Math.sin(t) * 12); cam.lookAt(0, 1, 0); R.render(scene, cam); })();
})();
</script>
</body>
</html>
